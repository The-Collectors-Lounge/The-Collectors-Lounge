const PAGE_TRANSLATIONS={"en":{"title":"Privacy Policy","kicker":"THE COLLECTORS LOUNGE","intro":"This Privacy Policy explains how The Collectors Lounge S.R.L., S. de R.L. processes personal data collected through this website.","resp":"1. Responsible party","resp_text":"The responsible party is The Collectors Lounge S.R.L., S. de R.L., with legal address at C.87 521, 97000 Centro, Mérida, Yucatán, Mexico. Contact: merida@thecollectorslounge.mx.","data":"2. Personal data collected","data_text":"Through the contact form, we may collect your name or company, email address, telephone number and the content of your message. We do not request sensitive personal data through the form.","purposes":"3. Purposes of processing","purposes_text":"Primary purposes: responding to contact requests, following up on business enquiries and managing prospective client relationships. Secondary purposes, where you provide the relevant consent: sending newsletters, invitations, information about events, services, offers and other commercial communications.","consent":"4. Consent and choices","consent_text":"The contact form separates the acknowledgement of this Privacy Policy from the optional consent to marketing communications. You may decline marketing consent without preventing us from responding to your enquiry. You may withdraw marketing consent at any time by contacting us at merida@thecollectorslounge.mx.","limits":"5. Limiting use or disclosure","limits_text":"You may contact us at the email above to request that we stop using your data for optional marketing purposes. We will apply your request within the time required by applicable law.","security":"6. Security and confidentiality","security_text":"We apply reasonable administrative, technical and physical measures intended to protect personal data against loss, unauthorized access, alteration or disclosure. Access is limited to persons who need the information for the purposes described in this policy.","providers":"7. Service providers and transfers","providers_text":"At present, the website does not intentionally use third-party analytics, advertising pixels or marketing platforms. The contact form may rely on infrastructure or email-delivery providers required to operate the service; where a provider processes personal data on our behalf, it must be subject to the applicable contractual and legal requirements. We do not sell personal data.","arco":"8. ARCO rights","arco_text":"You may request access to your personal data (Access), correction (Rectification), deletion (Cancellation) or objection to processing (Opposition), in accordance with applicable Mexican law. To make a request, email merida@thecollectorslounge.mx with enough information to identify the data and the right you wish to exercise. We may request information reasonably necessary to verify your identity.","retention":"9. Retention","retention_text":"We retain personal data only for as long as reasonably necessary for the purposes described in this policy and for applicable legal, accounting, contractual or dispute-resolution obligations. When data is no longer necessary, it will be deleted or otherwise handled in accordance with applicable law.","cookies":"10. Cookies","cookies_text":"The website is intended to use only cookies or similar technologies that are strictly necessary for its operation. We do not currently use advertising or analytics cookies.","changes":"11. Changes to this policy","changes_text":"We may update this Privacy Policy when our practices or applicable legal requirements change. The latest version will be published on this page. Last updated: September 14, 2026.","back":"Back to the website","legal":"Legal Notice"},"fr":{"title":"Politique de confidentialité","kicker":"THE COLLECTORS LOUNGE","intro":"Cette Politique de confidentialité explique comment The Collectors Lounge S.R.L., S. de R.L. traite les données personnelles collectées via ce site.","resp":"1. Responsable du traitement","resp_text" rs_text":"À ce jour, le site n’utilise pas intentionnellement d’outils tiers d’analyse, de pixels publicitaires ou de plateformes marketing. Le formulaire peut s’appuyer sur des infrastructures ou prestataires d’envoi d’emails nécessaires au fonctionnement du service ; lorsqu’un prestataire traite des données pour notre compte, il doit être soumis aux exigences contractuelles et légales applicables. Nous ne vendons pas les données personnelles.","arco":"8. Droits ARCO","arco_text":"Vous pouvez demander l’accès à vos données personnelles (Accès), leur rectification, leur suppression (Annulation) ou vous opposer à leur traitement (Opposition), conformément au droit mexicain applicable. Pour exercer un droit, écrivez à merida@thecollectorslounge.mx en indiquant les données concernées et le droit exercé. Nous pouvons demander les informations raisonnablement nécessaires pour vérifier votre identité.","retention":"9. Conservation","retention_text":"Nous conservons les données personnelles uniquement pendant la durée raisonnablement nécessaire aux finalités décrites dans cette politique et aux obligations légales, comptables, contractuelles ou de résolution des litiges applicables. Lorsque les données ne sont plus nécessaires, elles sont supprimées ou traitées conformément au droit applicable.","cookies":"10. Cookies","cookies_text":"Le site est destiné à utiliser uniquement des cookies ou technologies similaires strictement nécessaires à son fonctionnement. Nous n’utilisons actuellement pas de cookies publicitaires ou analytiques.","changes":"11. Modifications de cette politique","changes_text":"Nous pouvons mettre à jour cette Politique de confidentialité lorsque nos pratiques ou les exigences légales applicables évoluent. La dernière version sera publiée sur cette page. Dernière mise à jour : 14 septembre 2026.","back":"Retour au site","legal":"Mentions légales"},"es":{"title":"Política de privacidad","kicker":"THE COLLECTORS LOUNGE","intro":"Esta Política de privacidad explica cómo The Collectors Lounge S.R.L., S. de R.L. trata los datos personales recopilados a través de este sitio.","resp":"1. Responsable","resp_text":"El responsable es The Collectors Lounge S.R.L., S. de R.L., con domicilio legal en C.87 521, 97000 Centro, Mérida, Yucatán, México. Contacto: merida@thecollectorslounge.mx.","data":"2. Datos personales recopilados","data_text":"A través del formulario de contacto podemos recopilar su nombre o empresa, correo electrónico, teléfono y el contenido de su mensaje. No solicitamos datos personales sensibles mediante el formulario.","purposes":"3. Finalidades del tratamiento","purposes_text":"Finalidades principales: responder solicitudes de contacto, dar seguimiento a consultas comerciales y gestionar relaciones con prospectos. Finalidades secundarias, cuando otorgue el consentimiento correspondiente: enviar newsletters, invitaciones, información sobre eventos, servicios, ofertas y otras comunicaciones comerciales.","consent":"4. Consentimiento y opciones","consent_text":"El formulario separa la confirmación de lectura de esta Política de privacidad del consentimiento opcional para comunicaciones de marketing. Puede rechazar el consentimiento de marketing sin impedir que respondamos a su solicitud. Puede retirar su consentimiento de marketing en cualquier momento escribiendo a merida@thecollectorslounge.mx.","limits":"5. Limitar el uso o divulgación","limits_text":"Puede contactarnos en el correo indicado para solicitar que dejemos de utilizar sus datos para fines de marketing opcionales. Aplicaremos su solicitud dentro de los plazos previstos por la legislación aplicable.","security":"6. Seguridad y confidencialidad","security_text":"Aplicamos medidas administrativas, técnicas y físicas razonables destinadas a proteger los datos personales frente a pérdida, acceso no autorizado, alteración o divulgación. El acceso se limita a las personas que necesitan la información para las finalidades descritas en esta política.","providers":"7. Proveedores y transferencias","providers_text":"Actualmente, el sitio no utiliza intencionadamente herramientas de analítica de terceros, píxeles publicitarios ni plataformas de marketing. El formulario puede depender de infraestructura o proveedores de envío de correo necesarios para operar el servicio; cuando un proveedor trate datos en nuestro nombre, deberá estar sujeto a los requisitos contractuales y legales aplicables. No vendemos datos personales.","arco":"8. Derechos ARCO","arco_text":"Puede solicitar el acceso a sus datos personales (Acceso), su rectificación, cancelación o eliminación, u oponerse a su tratamiento (Oposición), de conformidad con la legislación mexicana aplicable. Para realizar una solicitud, escriba a merida@thecollectorslounge.mx indicando los datos y el derecho que desea ejercer. Podemos solicitar información razonablemente necesaria para verificar su identidad.","retention":"9. Conservación","retention_text":"Conservamos los datos personales solo durante el tiempo razonablemente necesario para las finalidades descritas en esta política y para las obligaciones legales, contables, contractuales o de resolución de controversias aplicables. Cuando los datos ya no sean necesarios, se eliminarán o tratarán conforme a la ley aplicable.","cookies":"10. Cookies","cookies_text":"El sitio está destinado a utilizar únicamente cookies o tecnologías similares estrictamente necesarias para su funcionamiento. Actualmente no utilizamos cookies publicitarias ni de analítica.","changes":"11. Cambios en esta política","changes_text":"Podemos actualizar esta Política de privacidad cuando cambien nuestras prácticas o los requisitos legales aplicables. La versión más reciente se publicará en esta página. Última actualización: 14 de septiembre de 2026.","back":"Volver al sitio","legal":"Aviso legal"}};
